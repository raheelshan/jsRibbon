<html>
    <head>
    
    </head>
    <script src="./jsRibbon.js"></script>

    <script>
        jsRibbon.autoRegister = true;
        console.log(jsRibbon.getComponents());
    </script>
    <body>
        <div id="container">
            <!-- jsRibbon has no bespoke AJAX form helper — for AJAX form submission, use
                 HTMX (hx-post/hx-target/hx-swap). Any HTML HTMX injects is auto-hydrated
                 by jsRibbon's MutationObserver, no extra wiring needed. -->
            Form Default Submit
            <hr>
            <div data-bind="component:FormCheck">
                <form method="post" action="/api/products/save" id="formCheck">
                    <input type="text" name="name" id="">
                    <button type="submit">Submit</button>
                </form>
            </div>
        </div>
    </body>
</html>
