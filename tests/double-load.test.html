<html>
<head>
<script>
    window.logs = [];
    for (const lvl of ['warn', 'error']) {
        const orig = console[lvl];
        console[lvl] = (...a) => { logs.push(lvl + ': ' + a.filter(x => typeof x === 'string').join(' ')); orig.apply(console, a); };
    }
    window.addEventListener('error', e => logs.push('uncaught: ' + e.message));
</script>
<script src="../src/jsRibbon.js"></script>
<script>
    window.hits = 0;
    window.made = 0;
    jsRibbon.component('Counter', ($state) => {
        made++;
        return { inc() { hits++; $state.count++; } };
    });
    window.firstApi = window.jsRibbon;
</script>
<!-- e.g. a layout and a partial both include the script -->
<script src="../src/jsRibbon.js"></script>
<script>
    jsRibbon.component('Late', () => ({ ping() { hits += 100; } }));
</script>
</head>
<body>
<div id="c" data-bind="component:Counter">
    <input type="number" data-bind="value:count" value="0">
    <button id="b" data-bind="click:inc">+</button>
    <ul id="l" data-bind="foreach:[data: items, as: item]"><li data-bind="text:item">a</li></ul>
</div>
<div id="slot"></div>

<pre id="out"></pre>
<script>
    const out = [];
    const check = (label, actual, expected) => {
        const ok = JSON.stringify(actual) === JSON.stringify(expected);
        out.push((ok ? 'PASS ' : 'FAIL ') + label + ' => ' + JSON.stringify(actual) + (ok ? '' : ' expected ' + JSON.stringify(expected)));
    };

    window.addEventListener('load', () => setTimeout(() => {
        try {
            check('first copy stays in charge', window.jsRibbon === firstApi, true);
            check('second load warns once', logs.filter(l => /loaded more than once/.test(l)).length, 1);
            check('component registered before 2nd load still works', made, 1);
            document.getElementById('b').click();
            check('click handled once', [hits, document.getElementById('c').$state.count], [1, 1]);
            document.getElementById('c').$state.items.push('b');
            check('foreach push renders once', document.getElementById('l').children.length, 2);

            document.getElementById('slot').innerHTML =
                '<div id="late" data-bind="component:Late"><span data-bind="text:t">x</span><button id="lb" data-bind="click:ping">p</button></div>';
            setTimeout(() => {
                check('injected HTML registered once', jsRibbon.getInstances('Late').length, 1);
                document.getElementById('lb').click();
                check('component registered after 2nd load works', hits, 101);
                check('no other warnings/errors', logs.filter(l => !/loaded more than once/.test(l)), []);
                document.getElementById('out').textContent = out.join('\n');
            }, 20);
        } catch (e) {
            out.push('ERROR ' + e.stack);
            document.getElementById('out').textContent = out.join('\n');
        }
    }, 50));
</script>
</body>
</html>
